[pytest]
# `pytest` and `python -m pytest` are not equivalent: only the latter puts the
# working directory on sys.path. The suite was only ever run the second way, so
# `from app import ...` in tests/conftest.py resolved by accident, and bare
# `pytest` -- which is what CI runs, and what the README and CLAUDE.md tell you to
# run -- failed with ModuleNotFoundError: No module named 'app'.
#
# Fixing it here rather than in the workflow, so the documented command works for
# anyone, not just for CI.
pythonpath = .
testpaths = tests
