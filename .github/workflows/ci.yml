name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Must match the Dockerfile's FROM python:3.12-slim. Bump both together.
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        # Without these the app defaults to /data. CLAUDE.md documents them.
        env:
          VAULT_DB: ./dev/vault.db
          VAULT_CONTENT: ./dev/content
          VAULT_INBOX: ./dev/inbox
          VAULT_TOKEN: ci-token
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t ideasvault:ci .
